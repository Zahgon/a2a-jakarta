# The gRPC server is off unless a suite asks for it.
#
# Adding the gRPC modules to this module's classpath makes their @GrpcService beans visible to
# every suite's component scan, and the net.devh starter would then bind a server for all of them.
# Only the gRPC suites need one, and they set grpc.server.port explicitly; -1 keeps it unbound
# everywhere else, which matches the source, where each Arquillian module packaged just the one
# transport it was testing.
grpc.server.port=-1
